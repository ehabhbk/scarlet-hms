; Scarlet HMS -- device listeners (HL7/ASTM + DICOM C-STORE)
; Install: sudo cp deploy/supervisor/scarlet-devices.conf /etc/supervisor/conf.d/
; Then:    sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status scarlet-devices:*

[group:scarlet-devices]
programs=hl7,dicom

[program:hl7]
process_name=%(program_name)s
command=/usr/bin/php /var/www/scarlet-hms/artisan devices:listen --host=0.0.0.0 --lab-port=2575 --radiology-port=2576
directory=/var/www/scarlet-hms
user=www-data
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scarlet-devices-hl7.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:dicom]
process_name=%(program_name)s
command=/usr/bin/php /var/www/scarlet-hms/artisan devices:listen-dicom --host=0.0.0.0 --port=2577
directory=/var/www/scarlet-hms
user=www-data
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scarlet-devices-dicom.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
